<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kuis Interaktif</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <!-- Tone.js (SFX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>

    <!-- MathJax (Rumus Matematika) -->
    <script>
        MathJax = { tex: { inlineMath: [['\\(', '\\)']] } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- CSS Kustom -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="p-4">

    <!-- Canvas Latar Belakang Animasi -->
    <canvas id="bg-canvas"></canvas>

    <!-- Audio Musik Latar -->
    <audio id="bg-music" src="./assets/musikku.mp3" loop muted></audio>

    <!-- ======================================================
         FLOATING CONTROLS (Selalu Tampil)
         ====================================================== -->
    <div id="floating-controls">

        <!-- Tombol Toggle Tema (Terang/Gelap) -->
        <button id="theme-toggle-btn-floating" class="floating-icon-btn" title="Ganti Tema">
            <svg id="theme-sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/><path d="M12 20v2"/>
                <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/>
                <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
            </svg>
            <svg id="theme-moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        </button>

        <!-- Tombol Toggle Musik -->
        <button id="music-toggle-btn-floating" class="floating-icon-btn is-muted" title="Musik Latar">
            <svg id="music-icon-unmuted" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            <svg id="music-icon-muted" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <line x1="22" x2="16" y1="9" y2="15"/>
                <line x1="16" x2="22" y1="9" y2="15"/>
            </svg>
        </button>
    </div>

    <!-- ======================================================
         KONTAINER UTAMA
         ====================================================== -->
    <div class="main-container bg-white p-4 sm:p-6 rounded-xl shadow-2xl">

        <!-- 1. MENU UTAMA -->
        <div id="menu-container" class="opacity-100">
            <h1 class="text-3xl font-bold text-center text-slate-800 mb-6">Aplikasi Kuis</h1>
            <h2 class="text-lg font-semibold text-slate-700 mb-3">Pilih Mata Pelajaran:</h2>

            <!-- Spinner Pemuatan -->
            <div id="loading-spinner" class="flex flex-col items-center justify-center my-6">
                <svg class="w-8 h-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                </svg>
                <p class="mt-2 text-sm text-slate-600">Memuat daftar pelajaran...</p>
            </div>

            <!-- Tombol Mata Pelajaran (di-generate JavaScript) -->
            <div id="subject-button-container" class="flex flex-col gap-3 mb-6 hidden"></div>

            <button id="start-btn" class="w-full bg-green-600 text-white px-6 py-4 rounded-lg font-bold text-lg hover:bg-green-700 transition-all hidden">
                Mulai Kuis
            </button>
        </div>

        <!-- 2. LAYAR KUIS -->
        <div id="quiz-container" class="opacity-0 hidden">

            <!-- Header Kuis -->
            <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                <h1 id="quiz-title" class="text-xl font-bold text-slate-800">Kuis</h1>
                <div class="flex items-center gap-3">
                    <div id="timer-display" class="text-lg font-semibold text-red-600 bg-red-100 px-3 py-1 rounded-md">80:00</div>
                    <!-- Tombol Daftar Soal (mobile only) -->
                    <button id="open-nav-btn" class="text-sm text-white bg-blue-600 px-3 py-1 rounded-md hover:bg-blue-700 font-medium transition-all lg:hidden">
                        Daftar Soal
                    </button>
                    <button id="back-to-menu-quiz-btn" class="text-sm text-blue-600 hover:underline">
                        Kembali ke Menu
                    </button>
                </div>
            </div>

            <!-- Layout 2 Kolom (desktop) -->
            <div class="lg:flex lg:gap-6">

                <!-- Kolom Kiri: Soal -->
                <div id="quiz-content" class="w-full lg:w-7/12">

                    <!-- Wacana / Teks Bacaan -->
                    <div id="passage-container" class="mb-5 p-4 bg-gray-50 border rounded-lg max-h-48 overflow-y-auto hidden">
                        <h4 id="passage-title" class="font-bold text-sm text-gray-700 mb-2"></h4>
                        <div id="passage-content" class="text-sm text-gray-800 leading-relaxed"></div>
                    </div>

                    <!-- Spinner Soal -->
                    <div id="question-loading-spinner" class="hidden flex-col items-center justify-center my-6">
                        <svg class="w-8 h-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                        </svg>
                        <p class="mt-2 text-sm text-slate-600">Memuat soal...</p>
                    </div>

                    <!-- Area Soal -->
                    <div id="question-area" class="opacity-0">
                        <div id="question-counter" class="text-sm font-medium text-slate-600 bg-slate-200 px-3 py-1 rounded-full w-fit mb-4"></div>
                        <div class="mb-5">
                            <p id="question-text" class="text-lg font-semibold text-slate-900 leading-relaxed"></p>
                        </div>
                        <div id="options-container" class="flex flex-col gap-3"></div>
                    </div>

                    <!-- Kotak Penjelasan -->
                    <div id="explanation-box" class="hidden mt-4 p-4 rounded-lg border">
                        <p id="explanation-text" class="text-sm mt-1"></p>
                    </div>

                    <!-- Tombol Navigasi Soal -->
                    <div class="flex flex-col sm:flex-row sm:justify-between items-center mt-6 gap-2">
                        <button id="prev-btn" class="bg-slate-300 text-slate-700 px-5 py-2 rounded-lg font-medium hover:bg-slate-400 transition-all disabled:opacity-50 w-full sm:w-auto">
                            Sebelumnya
                        </button>
                        <button id="finish-btn" class="bg-green-600 text-white px-5 py-3 sm:py-2 rounded-lg font-bold hover:bg-green-700 transition-all w-full sm:w-auto order-first sm:order-none text-lg sm:text-base">
                            Selesai
                        </button>
                        <button id="review-back-btn" class="hidden bg-red-500 text-white px-5 py-3 sm:py-2 rounded-lg font-bold hover:bg-red-600 transition-all w-full sm:w-auto order-first sm:order-none text-lg sm:text-base">
                            Kembali ke Menu Skor
                        </button>
                        <button id="next-btn" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition-all w-full sm:w-auto">
                            Berikutnya
                        </button>
                    </div>
                </div>

                <!-- Kolom Kanan: Navigasi Soal (desktop) -->
                <div id="desktop-nav-container" class="hidden lg:block lg:w-5/12">
                    <h3 class="text-lg font-semibold text-slate-700 mb-4">Daftar Soal</h3>
                    <div id="desktop-nav-panel"></div>
                </div>

            </div>
        </div>

        <!-- 3. LAYAR SKOR -->
        <div id="score-container" class="opacity-0 hidden text-center">
            <h2 class="text-2xl font-bold text-slate-800 mb-4">Kuis Selesai!</h2>
            <p class="text-xl text-slate-700 mb-2">Skor Anda:</p>
            <p id="score-text" class="text-5xl font-bold text-blue-600 mb-6"></p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <button id="review-btn" class="bg-purple-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-purple-700 transition-all text-lg">
                    Lihat Pembahasan
                </button>
                <button id="reset-btn" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition-all text-lg">
                    Ulangi Kuis
                </button>
                <button id="back-to-menu-score-btn" class="bg-slate-300 text-slate-700 px-6 py-3 rounded-lg font-medium hover:bg-slate-400 transition-all text-lg">
                    Kembali ke Menu
                </button>
            </div>
        </div>

    </div>
    <!-- END KONTAINER UTAMA -->


    <!-- ======================================================
         MODAL: NAVIGASI SOAL (Mobile)
         ====================================================== -->
    <div id="modal-backdrop-nav" class="modal-backdrop hidden opacity-0"></div>
    <div id="modal-container-nav" class="modal-container bg-white rounded-xl shadow-2xl p-4 sm:p-6 hidden opacity-0">
        <div class="flex justify-between items-center mb-4">
            <h3 id="modal-nav-title" class="text-lg font-semibold text-slate-700">Daftar Soal</h3>
            <button id="close-nav-btn" class="p-1.5 rounded-md text-red-600 bg-red-100 hover:bg-red-200 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                </svg>
            </button>
        </div>
        <div id="quiz-nav-panel"></div>
    </div>


    <!-- ======================================================
         MODAL: KONFIRMASI SELESAI
         ====================================================== -->
    <div id="modal-backdrop-finish" class="modal-backdrop hidden opacity-0"></div>
    <div id="modal-container-finish" class="modal-container bg-white rounded-xl shadow-2xl p-4 sm:p-6 hidden opacity-0">
        <h3 class="text-xl font-bold text-slate-800 mb-4">Konfirmasi Selesai</h3>
        <p class="text-slate-700 mb-6">Anda yakin sudah mengerjakan semua soal dan mengeceknya?</p>
        <div class="flex justify-end gap-3">
            <button id="cancel-finish-btn" class="bg-red-500 text-white px-5 py-2 rounded-lg font-medium hover:bg-red-600 transition-all">
                Eh, gajadi
            </button>
            <button id="confirm-finish-btn" class="bg-green-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-green-700 transition-all">
                Iya, udah nih
            </button>
        </div>
    </div>


    <!-- ======================================================
         JAVASCRIPT UTAMA
         ====================================================== -->
    <script type="module" src="./app.js"></script>

</body>
</html>
